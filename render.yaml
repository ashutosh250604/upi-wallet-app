services:
  - type: web
    name: wault-upi
    runtime: docker
    plan: free
    dockerfilePath: ./wallet-app-backend/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Paste the Neon connection string in the Render dashboard (it is not stored in git).
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: VPA_SUFFIX
        value: okwault
      # Session lifetime in minutes. The app clamps anything above 30.
      - key: JWT_EXPIRES_MINUTES
        value: "30"
